name: ${COMPOSE_PROJECT_NAME:-familienrezepte}

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    networks:
      - rezepte

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    networks:
      - rezepte

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    env_file:
      - ${REZEPTE_ENV_FILE}
      - ${REZEPTE_SECRETS_FILE}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - rezepte

  mongodb:
    image: ${MONGODB_IMAGE:-mongo:7}
    restart: unless-stopped
    env_file:
      - ${REZEPTE_ENV_FILE}
      - ${REZEPTE_SECRETS_FILE}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'if command -v mongosh >/dev/null 2>&1; then mongosh --quiet --username "$${MONGO_INITDB_ROOT_USERNAME}" --password "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase admin --eval ''db.adminCommand({ ping: 1 }).ok'' localhost:27017/admin | grep 1; else mongo --quiet --username "$${MONGO_INITDB_ROOT_USERNAME}" --password "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase admin --eval ''db.adminCommand({ ping: 1 }).ok'' localhost:27017/admin | grep 1; fi',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - rezepte

volumes:
  mongodb_data:

networks:
  rezepte:
    driver: bridge
