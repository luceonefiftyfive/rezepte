[project]
name = "familienrezepte-backend"
version = "0.1.0"
description = "Backend for Familienrezepte"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "motor>=3.7",
    "pydantic>=2.10,<3",
    "email-validator>=2.0,<3",
    "pydantic-settings>=2.7,<3",
    "python-jose[cryptography]>=3.3,<4",
    "boto3>=1.35,<2",
    "openpyxl>=3.1,<4",
    "python-multipart>=0.0.20,<1",
    "httpx2>=2.0,<3",
    "pytest>=7.4,<8",
    "pytest-asyncio>=0.22,<1",
    "mongomock-motor",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]