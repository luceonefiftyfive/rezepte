[project]
name = "familienrezepte-backend"
version = "0.1.0"
description = "Test backend for Familienrezepte"
requires-python = ">=3.13,<3.14"
dependencies = [
    "litestar>=2.24,<3",
    "uvicorn[standard]>=0.34,<1",
    "pydantic>=2.10,<3",
    "email-validator>=2.2,<3",
    "pydantic-settings>=2.7,<3",
    "pymongo>=4.13,<5",
    "motor>=3.7,<4",
    "boto3>=1.35,<2",
    "python-multipart>=0.0.20,<1",
    "python-jose>=3.5,<4",
    "pyyaml>=6.0,<7",
    "httpx2>=2.5,<3",
]

[tool.uv]
package = false
[dependency-groups]
dev = [
    "mongomock-motor>=0.0.36,<1",
    "pytest>=8.3,<10",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]
